<!--
  Shared <head>: reference copy. Replace every {{…}} per page.
  Keep <html lang="en-IN" class="no-js"> on the root element so main.js can swap it to "js".
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{Page title}} | Invest 4U Solutions</title>
<meta name="description" content="{{Unique 140–160 character description}}">
<link rel="canonical" href="https://www.invest4u.in/{{page}}.html">
<meta name="theme-color" content="#013364">

<!-- Open Graph / Twitter -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Invest 4U Solutions">
<meta property="og:locale" content="en_IN">
<meta property="og:title" content="{{Page title}} | Invest 4U Solutions">
<meta property="og:description" content="{{Same as meta description}}">
<meta property="og:url" content="https://www.invest4u.in/{{page}}.html">
<meta property="og:image" content="https://www.invest4u.in/assets/images/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Invest4U, Financial Architects since 1992">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{Page title}} | Invest 4U Solutions">
<meta name="twitter:description" content="{{Same as meta description}}">
<meta name="twitter:image" content="https://www.invest4u.in/assets/images/og-image.jpg">
<meta name="twitter:image:alt" content="Invest4U, Financial Architects since 1992">

<!-- Icons -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

<!-- Font: Switzer, self-hosted and declared with @font-face in css/style.css.
     (No <link rel="preload">: font preloads need CORS, which fails when a page is opened from disk.) -->

<link rel="stylesheet" href="css/style.css">
<script src="js/main.js" defer></script>
